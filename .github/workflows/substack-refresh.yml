name: Refresh Substack posts

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 7am Eastern (EDT)
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-substack.mjs
      - name: Commit if posts changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/substack.json
          git diff --staged --quiet || (git commit -m "Refresh Substack posts" && git push)
