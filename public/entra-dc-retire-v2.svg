<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 580" width="1086" height="1740" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="362" height="580" fill="#f6f4ef"/>
  <rect x="6" y="6" width="350" height="568" fill="none" stroke="#cfcac0" stroke-width="1"/>

  <text x="14" y="26" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#6b6b6b">BEFORE</text>
  <text x="196" y="26" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#6b6b6b">AFTER</text>

  <!-- ===== BEFORE ===== -->
  <g stroke="#8a8a8a" stroke-width="1.2" fill="none">
    <line x1="92" y1="80" x2="92" y2="100"/>
    <line x1="92" y1="140" x2="92" y2="160"/>
  </g>
  <rect x="14" y="40" width="156" height="40" fill="#e6eef6" stroke="#2f5d8a" stroke-width="1.3"/>
  <rect x="14" y="100" width="156" height="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <rect x="14" y="160" width="156" height="84" fill="#fbf1ea" stroke="#c8693a" stroke-width="1.8"/>
  <rect x="26" y="192" width="132" height="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>

  <g text-anchor="middle" fill="#1d2b3a">
    <text x="92" y="57" font-size="10" font-weight="700">PCs</text>
    <text x="92" y="70" font-size="7" font-family="Courier, monospace" fill="#555">20 users, domain-joined</text>
    <text x="92" y="117" font-size="10" font-weight="700">Domain controller</text>
    <text x="92" y="130" font-size="7" font-family="Courier, monospace" fill="#555">VM in the firm's Azure tenant</text>
    <text x="92" y="176" font-size="11" font-weight="700" fill="#b4541f">Synology NAS</text>
    <text x="92" y="187" font-size="7" font-family="Courier, monospace" fill="#555">joined to the domain</text>
    <text x="92" y="209" font-size="10" font-weight="700">Project files</text>
    <text x="92" y="222" font-size="7" font-family="Courier, monospace" fill="#555">access runs through the DC</text>
  </g>

  <!-- middle arrow -->
  <g stroke="#1d2b3a" stroke-width="1.5" fill="#1d2b3a">
    <line x1="174" y1="142" x2="186" y2="142"/>
    <polygon points="186,138 192,142 186,146" stroke="none"/>
  </g>

  <!-- ===== AFTER ===== -->
  <g stroke="#8a8a8a" stroke-width="1.2" fill="none">
    <line x1="272" y1="80" x2="272" y2="100"/>
    <line x1="272" y1="140" x2="272" y2="160" stroke-dasharray="2 2"/>
  </g>
  <rect x="196" y="40" width="152" height="40" fill="#e6eef6" stroke="#2f5d8a" stroke-width="1.3"/>
  <rect x="196" y="100" width="152" height="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <rect x="196" y="160" width="152" height="84" fill="#fbf1ea" stroke="#c8693a" stroke-width="1.8"/>
  <rect x="208" y="192" width="128" height="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <rect x="196" y="262" width="152" height="34" fill="#ffffff" stroke="#c8453a" stroke-width="1.3" stroke-dasharray="3 2"/>

  <g text-anchor="middle" fill="#1d2b3a">
    <text x="272" y="57" font-size="10" font-weight="700">PCs</text>
    <text x="272" y="70" font-size="7" font-family="Courier, monospace" fill="#555">20 users, Entra-joined</text>
    <text x="272" y="117" font-size="10" font-weight="700">Entra ID</text>
    <text x="272" y="130" font-size="7" font-family="Courier, monospace" fill="#555">sign-in without the DC</text>
    <text x="272" y="176" font-size="11" font-weight="700" fill="#b4541f">Synology NAS</text>
    <text x="272" y="187" font-size="7" font-family="Courier, monospace" fill="#555">sign-in options evaluated</text>
    <text x="272" y="209" font-size="10" font-weight="700">Project files</text>
    <text x="272" y="222" font-size="7" font-family="Courier, monospace" fill="#555">NAS or Entra group access</text>
    <text x="272" y="277" font-size="10" font-weight="700" fill="#6b6b6b">Domain controller VM</text>
    <text x="272" y="288" font-size="7" font-family="Courier, monospace" fill="#555">retired, as its own step</text>
  </g>

  <!-- ===== STAGES ===== -->
  <text x="14" y="318" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#6b6b6b">DONE IN STAGES, NOT ALL AT ONCE</text>
  <text x="14" y="334" font-size="7" font-family="Courier, monospace" fill="#555">for each PC, in stages</text>
  <text x="14" y="406" font-size="7" font-family="Courier, monospace" fill="#555">firm-wide</text>
  <rect x="14" y="340" width="106" height="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <circle cx="28" cy="365" r="8" fill="#2f5d8a"/>
  <text x="28" y="368.3" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1</text>
  <text x="42" y="357.0" font-size="8.5" font-weight="700" fill="#1d2b3a">Remove PC</text>
  <text x="42" y="368.0" font-size="8.5" font-weight="700" fill="#1d2b3a">from the</text>
  <text x="42" y="379.0" font-size="8.5" font-weight="700" fill="#1d2b3a">domain</text>
  <polygon points="121.5,361 127,365 121.5,369" fill="#1d2b3a"/>
  <rect x="128" y="340" width="106" height="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <circle cx="142" cy="365" r="8" fill="#2a8a7a"/>
  <text x="142" y="368.3" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2</text>
  <text x="156" y="362.5" font-size="8.5" font-weight="700" fill="#1d2b3a">Join PC</text>
  <text x="156" y="373.5" font-size="8.5" font-weight="700" fill="#1d2b3a">to Entra</text>
  <polygon points="235.5,361 241,365 235.5,369" fill="#1d2b3a"/>
  <rect x="242" y="340" width="106" height="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <circle cx="256" cy="365" r="8" fill="#7a5aa6"/>
  <text x="256" y="368.3" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3</text>
  <text x="270" y="357.0" font-size="8.5" font-weight="700" fill="#1d2b3a">Transfer</text>
  <text x="270" y="368.0" font-size="8.5" font-weight="700" fill="#1d2b3a">the user</text>
  <text x="270" y="379.0" font-size="8.5" font-weight="700" fill="#1d2b3a">profile</text>
  <rect x="14" y="412" width="106" height="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <circle cx="28" cy="437" r="8" fill="#c8693a"/>
  <text x="28" y="440.3" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">4</text>
  <text x="42" y="429.0" font-size="8.5" font-weight="700" fill="#1d2b3a">Restructure</text>
  <text x="42" y="440.0" font-size="8.5" font-weight="700" fill="#1d2b3a">NAS</text>
  <text x="42" y="451.0" font-size="8.5" font-weight="700" fill="#1d2b3a">permissions</text>
  <rect x="128" y="412" width="106" height="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <circle cx="142" cy="437" r="8" fill="#4a8a3a"/>
  <text x="142" y="440.3" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">5</text>
  <text x="156" y="429.0" font-size="8.5" font-weight="700" fill="#1d2b3a">Evaluate NAS</text>
  <text x="156" y="440.0" font-size="8.5" font-weight="700" fill="#1d2b3a">sign-in</text>
  <text x="156" y="451.0" font-size="8.5" font-weight="700" fill="#1d2b3a">options</text>
  <rect x="242" y="412" width="106" height="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
  <circle cx="256" cy="437" r="8" fill="#c8453a"/>
  <text x="256" y="440.3" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">6</text>
  <text x="270" y="429.0" font-size="8.5" font-weight="700" fill="#1d2b3a">Decommission</text>
  <text x="270" y="440.0" font-size="8.5" font-weight="700" fill="#1d2b3a">the domain</text>
  <text x="270" y="451.0" font-size="8.5" font-weight="700" fill="#1d2b3a">(own step)</text>
  <text x="14" y="484" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#6b6b6b">NAS PERMISSIONS, TWO PATHS</text>
  <rect x="14" y="494" width="163" height="62" fill="#fbf1ea" stroke="#c8693a" stroke-width="1.8"/>
  <text x="24" y="510" font-size="9.5" font-weight="700" fill="#b4541f">Permissions on the NAS</text>
  <text x="24" y="521" font-size="7" font-family="Courier, monospace" fill="#555">our recommendation</text>
  <text x="24" y="536" font-size="7" font-family="Courier, monospace" fill="#555">set and audited directly</text>
  <text x="24" y="546" font-size="7" font-family="Courier, monospace" fill="#555">on the NAS itself</text>
  <rect x="185" y="494" width="163" height="62" fill="#e6eef6" stroke="#2f5d8a" stroke-width="1.8"/>
  <text x="195" y="510" font-size="9.5" font-weight="700" fill="#2f5d8a">Entra groups</text>
  <text x="195" y="521" font-size="7" font-family="Courier, monospace" fill="#555">also possible</text>
  <text x="195" y="536" font-size="7" font-family="Courier, monospace" fill="#555">users assigned to groups</text>
  <text x="195" y="546" font-size="7" font-family="Courier, monospace" fill="#555">in the Entra admin center</text>
  </svg>
