    <text x="272" y="181" font-size="10" font-weight="700">Operations</text>
    <text x="272" y="213" font-size="10" font-weight="700">Archive</text>
    <text x="272" y="245" font-size="10" font-weight="700">Users</text>
    <text x="272" y="288" font-size="10" font-weight="700">Printing</text>
