    <rect x="276" y="372" width="72" height="40"/>
  </g>

  <g text-anchor="middle" fill="#1d2b3a">
    <text x="219" y="57" font-size="9" font-weight="700">Office</text>
    <text x="271" y="57" font-size="9" font-weight="700">Home</text>
    <text x="324" y="57" font-size="9" font-weight="700">Remote</text>
    <text x="272" y="112" font-size="11" font-weight="700" fill="#b4541f">Egnyte Cloud</text>
