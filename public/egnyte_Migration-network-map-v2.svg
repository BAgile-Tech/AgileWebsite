    <text x="312" y="390" font-size="10" font-weight="700">Mobile</text>
    <text x="312" y="402" font-size="7" font-family="Courier, monospace" fill="#555">open DWG</text>
    <text x="272" y="436" font-size="7" font-family="Courier, monospace" fill="#555">Same access from anywhere</text>
